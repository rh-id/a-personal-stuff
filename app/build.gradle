plugins {
    alias(libs.plugins.android.application)
}

apply from: '../gradle/license-html-generator.gradle'

def keyStoreFile = File.createTempFile("key", null)
keyStoreFile.deleteOnExit()

if (System.getenv("SIGNING_KEY") != null) {
    println 'key exist'
    keyStoreFile.bytes = Base64.decoder.decode(System.getenv("SIGNING_KEY"))
} else {
    println 'key NOT exist'
}

android {
    compileSdk = 37

    signingConfigs {
        release {
            storeFile keyStoreFile
            storePassword System.getenv("KEY_STORE_PASSWORD")
            keyAlias System.getenv("ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    defaultConfig {
        applicationId "m.co.rh.id.a_personal_stuff"
        minSdk 21
        targetSdk 37
        versionCode 25
        versionName "2.1.0"
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("SIGNING_KEY") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'm.co.rh.id.a_personal_stuff'
    buildFeatures {
        buildConfig true
    }
    packaging {
        resources.pickFirsts += 'META-INF/services/javax.xml.stream.XMLEventFactory'
        resources.excludes += 'META-INF/DEPENDENCIES'
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs

    implementation project(path: ':base')
    implementation project(path: ':barcode')
    implementation project(path: ':item-usage')
    implementation project(path: ':item-purchase')
    implementation project(path: ':item-maintenance')
    implementation project(path: ':item-reminder')
    implementation project(path: ':item-checklist')
    implementation project(path: ':settings')
    implementation libs.androidx.documentfile
    implementation libs.photo.view
    implementation libs.a.poi.spreadsheet

    testImplementation libs.junit
    testImplementation libs.mockito.core
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.work.testing
    androidTestImplementation libs.concurrent.utils
}

project.afterEvaluate {
    def versionCode = android.defaultConfig.versionCode
    File changeLogTxt = new File(project.rootDir, "fastlane/metadata/android/en-US/changelogs/" + versionCode + ".txt")
    if (changeLogTxt.exists()) {
        File outputChangeLog = new File(project.buildDir, "changelog.txt")
        if (!outputChangeLog.exists()) {
            outputChangeLog.parentFile.mkdirs()
            outputChangeLog.createNewFile()
        }
        outputChangeLog.bytes = changeLogTxt.bytes
    }
}